# Cut a GitHub Release whenever a version tag is pushed. The release carries
# the prebuilt CLI (tar.gz + checksums) and the web receiver bundle, so
# `curl | tar` is a complete install. Runs under the Action's own token —
# no external secrets needed.
name: release
on:
  push:
    tags: ["v*"]
  # Manual cut: the sealed-session git proxy can push branches but not tags,
  # so a dispatch with a tag input lets `gh release create` mint the tag at
  # HEAD itself (same assets, same notes, no external secrets).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.2.8)"
        required: true
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: resolve tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: package assets
        run: |
          tar -C bin/linux-x86_64 -czf oham-${TAG}-linux-x86_64.tar.gz oham SHA256SUMS
          (cd web && zip -qr ../oham-${TAG}-web.zip .)
          sha256sum oham-${TAG}-linux-x86_64.tar.gz oham-${TAG}-web.zip > RELEASE_SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            oham-${TAG}-linux-x86_64.tar.gz \
            oham-${TAG}-web.zip \
            RELEASE_SHA256SUMS \
            --title "OHAM $TAG" \
            --notes "OHAM — OrthoHolonic Accessible Memory. The usable reader: oham CLI (info · unseal · serve · repack · excerpt · windowed reads), the wasm receiver + pages, the one-tag <oham-stream> element. Every conversion reversible and gated; dogfood with ./dogfood.sh (every step prints the hash it must produce). Sealing is offered through the OHAM API — involvedinvolutions.com. Paul Phillips — solo developer · Apache-2.0 + Commons Clause."

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dist/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/gen-rl-millz/oham:${{ inputs.tag || github.ref_name }}
            ghcr.io/gen-rl-millz/oham:latest
